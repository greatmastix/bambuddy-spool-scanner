; Bambuddy Spool Scanner
; Default target: generic ESP32 DevKit (ESP32-WROOM-32) + RC522 over SPI.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; 6.9.0 ships Arduino-ESP32 2.0.17. MFRC522 1.4.11 does not build on the 3.x core.
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    ; Pin overrides live in src/pins.h; any of them can also be set here,
    ; e.g. -DPIN_BUZZER=-1 to disable the buzzer pin.

; Host-side unit tests for the tag decoder and key derivation:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_compat_mode = off
