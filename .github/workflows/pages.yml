name: web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio "esptool==4.8.1"
      - run: pio run -e esp32dev
      - name: Merge bootloader, partitions and app into one image
        run: |
          B=.pio/build/esp32dev
          mkdir -p site/firmware
          esptool.py --chip esp32 merge_bin -o site/firmware/bambuddy-spool-scanner.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - name: Assemble site
        run: |
          cp web/index.html site/
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          cat > site/manifest.json <<JSON
          {
            "name": "Bambuddy Spool Scanner",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [{ "path": "firmware/bambuddy-spool-scanner.bin", "offset": 0 }]
              }
            ]
          }
          JSON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
