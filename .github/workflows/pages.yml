name: web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio "esptool==4.8.1"
      - name: Version
        run: echo "VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION=\"${{ env.VERSION }}\"
        run: pio run -e esp32dev
      - name: Merge bootloader, partitions and app into one image
        run: |
          B=.pio/build/esp32dev
          mkdir -p site/firmware
          esptool.py --chip esp32 merge_bin -o site/firmware/bambuddy-spool-scanner.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - name: Check the scanner trusts the Pages certificate
        run: |
          sed -n '/R"PEM(/,/)PEM"/p' src/ota_roots.h > /tmp/roots.pem
          echo | openssl s_client -connect greatmastix.github.io:443 -servername greatmastix.github.io \
            -CAfile /tmp/roots.pem -verify_return_error > /tmp/tls.txt 2>&1 \
            || { cat /tmp/tls.txt; echo "::error::github.io no longer chains to a root in src/ota_roots.h"; exit 1; }
          grep -E "^depth|Verify return" /tmp/tls.txt
      - name: Assemble site
        run: |
          cp web/index.html site/
          cp .pio/build/esp32dev/firmware.bin site/firmware/app.bin
          cat > site/ota.json <<JSON
          {
            "version": "$VERSION",
            "path": "firmware/app.bin",
            "size": $(stat -c %s site/firmware/app.bin),
            "md5": "$(md5sum site/firmware/app.bin | cut -d' ' -f1)"
          }
          JSON
          cat site/ota.json
          cat > site/manifest.json <<JSON
          {
            "name": "Bambuddy Spool Scanner",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [{ "path": "firmware/bambuddy-spool-scanner.bin", "offset": 0 }]
              }
            ]
          }
          JSON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
